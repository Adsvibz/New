name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        id: loc
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          fi
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "No settings.gradle.kts found in repo"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          LICENSE_URL: ${{ secrets.LICENSE_URL }}
        run: |
          set +e
          echo "Licensing: $([ -n "$LICENSE_URL" ] && echo ON || echo OFF)"
          gradle assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== KOTLIN ERRORS ==="
            grep "^e:" build.log | head -40
            echo "=== GRADLE / RESOURCE ERRORS ==="
            grep -nE "What went wrong|Execution failed|error:|ERROR:|FAILED|Could not" -A6 build.log | head -80
          fi
          exit $code
      - name: Show signing certificate
        run: |
          APK="${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          TOOL="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$TOOL" verify --print-certs "$APK" | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.loc.outputs.dir }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
