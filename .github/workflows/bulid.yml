name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          Z=$(find . -iname "*o2dialer*.zip" -not -path "./.git/*" | head -1)
          if [ -z "$Z" ]; then Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -1); fi
          if [ -n "$Z" ]; then
            echo "Using zip: $Z"
            unzip -q -o "$Z" -d proj
            D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          elif [ -f settings.gradle.kts ]; then
            D=.
          else
            echo "No zip or project found in the repo."
            exit 1
          fi
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: ${{ env.DIR }}
        run: |
          if ! gradle assembleDebug --no-daemon --console=plain > build.log 2>&1; then
            echo "=== ERRORS ==="
            grep "^e:" build.log | head -40
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
