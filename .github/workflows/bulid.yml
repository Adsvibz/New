name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [design/o2dialer-v7-rebuild]
    paths:
      - '.github/workflows/bulid.yml'
      - 'O2Dialer/release/verification-request.txt'
permissions:
  contents: read
concurrency:
  group: o2-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: O2Dialer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - name: Validate release configuration
        env:
          LICENSE_URL: ${{ secrets.LICENSE_URL }}
        run: |
          case "$LICENSE_URL" in
            https://*) echo "Device licensing enabled" ;;
            *) echo "::error::A valid HTTPS LICENSE_URL secret is required for a distributable release"; exit 1 ;;
          esac
      - name: Test, lint and build release
        env:
          LICENSE_URL: ${{ secrets.LICENSE_URL }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Verify signed release and metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > out/signing-verification.txt
          "$TOOLS/aapt" dump badging "$APK" > out/apk-metadata.txt
          if grep -q 'application-debuggable' out/apk-metadata.txt; then
            echo "::error::APK must not be debuggable"; exit 1
          fi
          grep -q "package: name='com.o2dialer.app'" out/apk-metadata.txt
          grep -q "versionName='7.0'" out/apk-metadata.txt
          cp "$APK" out/O2Dialer-7.0-release.apk
          (cd out && sha256sum O2Dialer-7.0-release.apk > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nVariant: release\nLicensing: enabled\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > out/build-provenance.txt
          cat out/apk-metadata.txt
          cat out/signing-verification.txt
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O2Dialer-verification
          path: |
            O2Dialer/build.log
            O2Dialer/app/build/reports/tests/testReleaseUnitTest/
            O2Dialer/app/build/reports/lint-results-release.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-7.0-release
          path: O2Dialer/out/
          if-no-files-found: error
