name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [design/o2dialer-v7-rebuild]
    paths:
      - '.github/workflows/bulid.yml'
      - 'O2Dialer/release/verification-request.txt'
permissions:
  contents: read
concurrency:
  group: o2-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: O2Dialer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - name: Validate release configuration
        env:
          LICENSE_URL: ${{ secrets.LICENSE_URL }}
        run: |
          case "$LICENSE_URL" in
            https://*) echo "Device licensing enabled" ;;
            *) echo "::error::A valid HTTPS LICENSE_URL secret is required for a distributable release"; exit 1 ;;
          esac
      - name: Test, lint and build release
        env:
          LICENSE_URL: ${{ secrets.LICENSE_URL }}
        run: |
          set -o pipefail
          gradle testReleaseUnitTest lintRelease assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Verify signed release and metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > out/signing-verification.txt
          "$TOOLS/aapt" dump badging "$APK" > out/apk-metadata.txt
          if grep -q 'application-debuggable' out/apk-metadata.txt; then
            echo "::error::APK must not be debuggable"; exit 1
          fi
          grep -q "package: name='com.o2dialer.app'" out/apk-metadata.txt
          grep -q "versionName='7.0'" out/apk-metadata.txt
          cp "$APK" out/O2Dialer-7.0-release.apk
          (cd out && sha256sum O2Dialer-7.0-release.apk > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nVariant: release\nLicensing: enabled\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > out/build-provenance.txt
          cat out/apk-metadata.txt
          cat out/signing-verification.txt
          cat out/SHA256SUMS
      - name: Prepare verified update feed
        run: python3 release/prepare_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O2Dialer-verification
          path: |
            O2Dialer/build.log
            O2Dialer/app/build/reports/tests/testReleaseUnitTest/
            O2Dialer/app/build/reports/lint-results-release.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-7.0-release
          path: O2Dialer/out/
          if-no-files-found: error
  publish_update:
    needs: build
    if: github.ref == 'refs/heads/design/o2dialer-v7-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: O2Dialer-7.0-release
          path: release
      - name: Publish complete update after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          VERSION_CODE=$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')
          TAG="o2dialer-build-$VERSION_CODE"
          # A rerun of an older build must never become the latest update.
          LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ "$LATEST" =~ ^o2dialer-build-([0-9]+)$ ]] && (( BASH_REMATCH[1] >= VERSION_CODE )); then
            echo "This version or a newer update is already published."
            exit 0
          fi
          printf 'O2Dialer 7.0 (%s)\n\nVerified release build. Install over your existing app to retain campaigns and settings.\nCommit: %s\n' "$VERSION_CODE" "$GITHUB_SHA" > release-notes.txt
          # Keep the feed invisible until all assets are uploaded. Resume a failed draft safely.
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-state.txt 2>/dev/null; then
            if [[ "$(cat draft-state.txt)" != "true" ]]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "O2Dialer 7.0 ($VERSION_CODE)" --notes-file release-notes.txt
          fi
          gh release upload "$TAG" O2Dialer-7.0-release.apk update.json SHA256SUMS signing-verification.txt apk-metadata.txt build-provenance.txt --clobber
          gh release edit "$TAG" --draft=false --latest

  publish_browser_preview:
    name: Update native browser preview (optional)
    needs: [build, publish_update]
    if: github.ref == 'refs/heads/design/o2dialer-v7-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download verified release APK
        uses: actions/download-artifact@v4
        with:
          name: O2Dialer-7.0-release
          path: preview-release
      - name: Check browser preview connection and current release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APPETIZE_API_TOKEN" || -z "$APPETIZE_PUBLIC_KEY" ]]; then
            echo "Native browser preview is not connected. Add both APPETIZE_API_TOKEN and APPETIZE_PUBLIC_KEY as GitHub Actions secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION_CODE=$(python3 -c 'import json; print(json.load(open("preview-release/update.json"))["versionCode"])')
          LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ "$LATEST" != "o2dialer-build-$VERSION_CODE" ]]; then
            echo "Skipping an outdated APK; only the latest published release may replace the native browser preview."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Update real Android app on Appetize
        if: steps.gate.outputs.enabled == 'true'
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          platform: android
          appFile: preview-release/O2Dialer-7.0-release.apk
          fileType: apk
          note: O2Dialer native preview • ${{ github.sha }}
