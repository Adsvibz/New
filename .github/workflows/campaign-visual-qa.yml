name: Campaigns screenshot QA (native Android)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/campaign-visual-qa.yml'
      - '.github/scripts/seed_campaigns.py'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/V7Workspace.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/MainActivity.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/Components.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    name: Capture native 390x844 screen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build native preview APK
        working-directory: O2Dialer
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture Android screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim
          script: |
            set -eux
            adb shell wm size 390x844
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            adb install O2Dialer/app/build/outputs/apk/debug/app-debug.apk
            python3 .github/scripts/seed_campaigns.py
            adb push o2dialer.xml /data/local/tmp/o2dialer.xml
            adb shell chmod 644 /data/local/tmp/o2dialer.xml
            adb shell run-as com.o2dialer.app mkdir -p shared_prefs
            adb shell run-as com.o2dialer.app cp /data/local/tmp/o2dialer.xml shared_prefs/o2dialer.xml
            adb shell am start -n com.o2dialer.app/.MainActivity
            sleep 9
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/campaigns-390x844.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O2Dialer-native-campaigns-screenshot
          path: screenshots/
          if-no-files-found: warn
