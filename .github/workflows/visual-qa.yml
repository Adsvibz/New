name: Visual QA
on:
  workflow_dispatch:
  push:
    branches: [design/o2dialer-v7-rebuild]
    paths:
      - '.github/workflows/visual-qa.yml'
      - 'O2Dialer/release/visual-qa-request.txt'
permissions:
  contents: read
concurrency:
  group: o2-visual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - name: Build visual QA APK
        working-directory: O2Dialer
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Capture deterministic UI states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p screenshots
            adb install -r O2Dialer/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            for scenario in welcome1 welcome2 welcome3 workspace live results history settings; do
              adb shell am force-stop com.o2dialer.app
              adb shell am start -W -n com.o2dialer.app/.VisualQaActivity --es scenario "$scenario" --ei lang 0 --ei theme 1
              sleep 1
              adb exec-out screencap -p > "screenshots/en-light-$scenario.png"
            done
            for scenario in workspace live results settings; do
              adb shell am force-stop com.o2dialer.app
              adb shell am start -W -n com.o2dialer.app/.VisualQaActivity --es scenario "$scenario" --ei lang 1 --ei theme 2
              sleep 1
              adb exec-out screencap -p > "screenshots/ar-dark-$scenario.png"
            done
            adb shell wm size 720x1600
            adb shell wm density 420
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.o2dialer.app
            adb shell am start -W -n com.o2dialer.app/.VisualQaActivity --es scenario workspace --ei lang 1 --ei theme 1
            sleep 1
            adb exec-out screencap -p > screenshots/ar-light-compact-large-text-workspace.png
      - uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-visual-QA
          path: screenshots/
          if-no-files-found: error
