name: O2Dialer Android compatibility smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'O2Dialer/app/**'
      - '.github/workflows/android-compatibility.yml'
permissions:
  contents: read
concurrency:
  group: o2-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 33, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK and run unit tests
        working-directory: O2Dialer
        run: gradle testDebugUnitTest assembleDebug --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          working-directory: O2Dialer
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.0
            adb shell am start -W -n com.o2dialer.app/.MainActivity
            sleep 4
            adb shell pidof com.o2dialer.app
            adb shell wm size 320x720
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.o2dialer.app
            adb shell am start -W -n com.o2dialer.app/.MainActivity
            sleep 4
            adb shell pidof com.o2dialer.app
            mkdir -p compat-artifacts
            adb shell screencap -p /sdcard/o2compat.png
            adb pull /sdcard/o2compat.png compat-artifacts/android-${{ matrix.api-level }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api-level }}-launch-screenshot
          path: O2Dialer/compat-artifacts/
          if-no-files-found: ignore
