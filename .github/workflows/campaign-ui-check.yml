name: Campaign UI native build check
on:
  push:
    branches:
      - design/o2dialer-v7-rebuild
    paths:
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/V7Workspace.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/MainActivity.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/Components.kt'
      - 'O2Dialer/gradle/**'
      - 'O2Dialer/gradlew'
      - '.github/workflows/campaign-ui-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/V7Workspace.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/MainActivity.kt'
      - 'O2Dialer/app/src/main/java/com/o2dialer/app/Components.kt'
      - '.github/workflows/campaign-ui-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-campaign-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: O2Dialer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: Compile native Compose screen and run unit tests
        run: gradle testDebugUnitTest assembleDebug --no-daemon --console=plain --stacktrace
      - name: Publish debug APK for optional Android device testing
        uses: actions/upload-artifact@v4
        with:
          name: O2Dialer-Campaigns-UI-debug
          path: O2Dialer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
