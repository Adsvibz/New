<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff2f6">
<title>O2Dialer • Precision Design Studio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-synthesis:none;--bg:#eef2f7;--surface:#fff;--text:#111d2e;--muted:#52627a;--border:#dce3eb;--blue:#174fd1;--bluefade:#eaf0ff;--hero:#112940;--hero-muted:#bbcddd;--green:#067b55;--danger:#b32736;--orange:#9b6213;--tab:#121f32}
*{box-sizing:border-box}body{margin:0;background:#dce3ed;color:var(--text);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #69a5ff;outline-offset:2px}
.studio{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:22px}.aside{width:250px;padding-top:40px;color:#24344a}.aside h1{font-size:25px;letter-spacing:-.7px;margin:0 0 8px}.aside p{font-size:13px;line-height:1.65;color:#465b71}.aside b{color:#192a40}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.aside button,.toptools button{background:white;border:1px solid #c3cfdb;border-radius:10px;color:#18273a;padding:9px 12px;font-weight:650;font-size:12px}.hint{margin-top:26px;border-top:1px solid #bccbdc;padding-top:16px}
.phone{width:393px;height:min(850px,calc(100dvh - 44px));min-height:635px;border:8px solid #1a2635;border-radius:36px;overflow:hidden;background:var(--bg);box-shadow:0 28px 55px #243c5a35;display:flex;flex-direction:column;position:relative}.statusbar{height:29px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:3px 21px;font-size:12px;color:var(--text);font-weight:700}.screen{flex:1;overflow:auto;padding:18px 18px 20px;overscroll-behavior:contain;scrollbar-width:thin}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:10px}h2{font-size:24px;line-height:1.13;letter-spacing:-.65px;margin:0;font-weight:760}.eyebrow{font-weight:720;letter-spacing:1.2px;text-transform:uppercase;font-size:10px;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:12px}.sec{font-size:14px;font-weight:730}.section{margin:23px 0 10px;display:flex;align-items:center;justify-content:space-between}.iconbtn{border:1px solid var(--border);background:var(--surface);height:38px;width:38px;border-radius:11px;color:var(--text);display:grid;place-items:center;font-size:19px}.hero{background:var(--hero);color:white;border-radius:20px;padding:20px;box-shadow:0 11px 24px #1429421b}.hero .eyebrow,.hero .muted{color:var(--hero-muted)}.flex{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;background:#ffffff16;padding:8px 9px;color:white;font-size:11px;font-weight:650;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8bf0ba}.hero .name{font-size:24px;letter-spacing:-.6px;font-weight:720;line-height:1.2;margin:8px 0}.hero .number{font-size:15px;color:#c7d6e5;direction:ltr;text-align:start}.divider{height:1px;background:#ffffff25;margin:19px 0}.track{height:6px;border-radius:999px;background:#ffffff38;overflow:hidden}.track div{height:100%;width:6%;background:#79aaff;border-radius:999px;transition:width .3s}.rate{margin:10px 0 0;display:flex;justify-content:space-between;color:#c7d6e5;font-size:11px}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric strong{display:block;font-size:24px;letter-spacing:-.7px;line-height:1.25}.metric span{font-size:11px;color:var(--muted);line-height:1.3}.metric .positive{color:var(--green)}.metric .negative{color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}.item{padding:12px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border);min-height:66px}.item:last-child{border-bottom:0}.item .title{font-size:14px;font-weight:680;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.item .sub{font-size:11px;color:var(--muted);padding-top:4px}.avatar{height:34px;width:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:#e9f0fc;color:#2459c2;font-size:14px;font-weight:750}.rowend{font-size:12px;color:var(--muted);margin-inline-start:auto;text-align:end}.link{border:0;background:none;color:var(--blue);font-size:12px;font-weight:720;padding:6px}.primary{height:48px;background:var(--blue);color:#fff;border:0;border-radius:11px;font-weight:720;padding:0 15px}.outline{height:48px;background:var(--surface);color:var(--text);border:1px solid #a7b7cb;border-radius:11px;font-weight:670;padding:0 13px}.danger{color:var(--danger);border-color:#d0a4a7}.buttonrow{display:flex;gap:8px}.buttonrow>*{flex:1;min-width:0}.actions{position:relative;flex:none;background:var(--surface);padding:10px 15px 11px;border-top:1px solid var(--border)}.actions button{height:46px;font-size:13px}.navbar{height:65px;flex:none;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 6px max(5px,env(safe-area-inset-bottom))}.navbtn{border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border-radius:12px;font-size:10px;font-weight:600}.navbtn.active{background:var(--tab);color:#fff}.navbtn svg{width:20px;height:20px;stroke-width:1.9}.navbtn span{white-space:nowrap}
.progressline{height:5px;background:#e4eaf3;border-radius:10px;overflow:hidden;margin:10px 0 6px}.progressline i{display:block;height:100%;background:var(--blue)}.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin:10px -18px 0;padding:0 18px 10px}.filters button{white-space:nowrap;border:1px solid #cdd6e2;background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--muted);font-size:12px;font-weight:650}.filters button.active{background:var(--tab);color:#fff;border-color:var(--tab)}.search{width:100%;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:0 13px;color:var(--text);margin-top:10px}.tabsnote{font-size:11px;color:var(--muted);margin:14px 0 0}.pill{font-size:11px;font-weight:700;border-radius:7px;background:#e1f6ec;color:#076d48;padding:5px 8px}.switch{width:40px;height:24px;border-radius:22px;background:#c9d4df;border:0;position:relative}.switch i{position:absolute;background:#fff;top:3px;left:3px;height:18px;width:18px;border-radius:50%;box-shadow:0 1px 3px #1a293932;transition:transform .2s}.switch.on{background:var(--blue)}.switch.on i{transform:translateX(16px)}.toast{position:absolute;bottom:140px;inset-inline:17px;background:#14283e;color:white;border-radius:12px;padding:12px;text-align:center;font-size:12px;box-shadow:0 6px 20px #0002;z-index:3;display:none}
body.dark{--bg:#0b1420;--surface:#182536;--text:#f4f7fb;--muted:#b9c7d9;--border:#344558;--blue:#85aaff;--bluefade:#223c60;--hero:#21344b;--tab:#85aaff;background:#09111b}body.dark .navbtn.active{color:#071a30}body.dark .avatar{background:#2b4562;color:#b2d0ff}body.dark .pill{background:#183f34;color:#93e6bf}body.dark .filters button.active{color:#071a30}body.dark .primary{color:#071a30}body.dark .progressline{background:#2c3b50}body.dark .aside{color:#e0eaf8}body.dark .aside p{color:#b8c8de}
[dir=rtl] .aside,[dir=rtl] .screen{text-align:right}[dir=rtl] .statusbar{direction:ltr}[dir=rtl] .switch i{left:auto;right:3px}[dir=rtl] .switch.on i{transform:translateX(-16px)}
@media(max-width:780px){body{background:var(--bg)}.studio{padding:0;display:block}.aside{width:auto;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#fff;position:relative}.aside h1{font-size:14px}.aside p,.aside .hint{display:none}.controls{margin:0;gap:4px}.aside button{padding:7px 9px}.phone{border:0;border-radius:0;box-shadow:none;width:100%;height:calc(100dvh - 47px);min-height:300px}.statusbar{height:25px}.screen{padding:16px}.navbar{height:64px}.filters{margin-inline:-16px;padding-inline:16px}}
</style>
</head>
<body>
<div class="studio">
  <aside class="aside">
    <div><h1>O2Dialer <span style="color:#174fd1">Precision</span></h1><p>Interactive design preview. This runs on demo data, not your personal call lists.</p></div>
    <div class="controls"><button id="themeBtn">☾ Dark</button><button id="langBtn">عربي</button><button id="resetBtn">Reset</button></div>
    <div class="hint"><b>LIVE PREVIEW</b><p>Designs update here without installing an APK. Call controls are simulated. Real SIM, phone and notification behavior must be tested in Android.</p><p id="buildLine">Design studio</p></div>
  </aside>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>●●●  ▰  ▣</span></div>
    <main class="screen" id="screen" aria-live="polite"></main>
    <div class="actions" id="actions"></div>
    <nav class="navbar" id="navbar" aria-label="Main navigation"></nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script>
(function(){
const state={tab:"live",paused:false,theme:"light",lang:"en",filter:"All",contactFilter:"All",campaign:"Kayan",calls:44,total:739,answered:1,noAnswer:40,failed:3};
const contacts=[{name:"Mona Ibrahim",num:"+20 100 234 8701",status:"Answered"},{name:"Ahmed Hassan",num:"+20 102 777 6104",status:"No answer"},{name:"Youssef Nabil",num:"+20 111 830 2201",status:"Pending"},{name:"Nada Adel",num:"+20 122 320 6681",status:"Pending"},{name:"Omar Mostafa",num:"+20 100 920 4438",status:"Pending"}];
const history=[{name:"Mona Ibrahim",num:"+20 100 234 8701",status:"Answered",time:"10:41 AM"},{name:"Ahmed Hassan",num:"+20 102 777 6104",status:"No answer",time:"10:38 AM"},{name:"Youssef Nabil",num:"+20 111 830 2201",status:"Failed",time:"10:36 AM"},{name:"Nada Adel",num:"+20 122 320 6681",status:"Unverified",time:"10:31 AM"}];
const icons={campaigns:'<path d="M3 7h18M3 7l2-3h5l2 3M3 7v13h18V7M7 12h10M7 16h7"/>',live:'<path d="M6 3h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v5c0 1-1 2-2 2C10 21 3 14 3 5c0-1 1-2 3-2Z"/>',results:'<path d="M4 20V10m5 10V4m5 16v-7m6 7V8M2 20h20"/>',history:'<path d="M3 12a9 9 0 1 0 3-7M3 4v5h5M12 7v5l4 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5l2-1.5-2-1.5-.7-2 1-2.2-2.1-2-2 1-2-.8L12 2l-1.5 2.5-2 .8-2-1-2.1 2 1 2.2-.7 2-2 1.5 2 1.5.7 2-1 2.2 2.1 2 2-1 2 .8L12 22l1.5-2.5 2-.8 2 1 2.1-2-1-2.2z"/>'};
const I=(k)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[k]+'</svg>';
const txt=(a,b)=>state.lang==="ar"?b:a;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headline=(a,b)=>'<h2>'+txt(a,b)+'</h2>';
const cardMetric=(v,a,b,cls='')=>'<div class="metric"><strong class="'+cls+'">'+v+'</strong><span>'+txt(a,b)+'</span></div>';
const controls=()=>'<div class="buttonrow"><button class="primary" data-action="pause">'+(state.paused?txt('▶ Resume','▶ استئناف'):txt('Ⅱ Pause','Ⅱ إيقاف مؤقت'))+'</button><button class="outline" data-action="skip">'+txt('Skip','تخطّي')+'</button><button class="outline danger" data-action="stop">'+txt('Stop','إنهاء')+'</button></div>';
const pill=(st)=>'<span class="pill" style="'+(st==="No answer"?'background:#fff2dd;color:#86551a':st==="Failed"?'background:#ffe8ea;color:#9a2130':st==="Pending"?'background:#edf2f8;color:#52627a':'')+'">'+esc(st)+'</span>';
function row(c,detail){return '<div class="item"><div class="avatar">'+esc(c.name.split(' ').map(x=>x[0]).join('').slice(0,2))+'</div><div class="grow"><div class="title">'+esc(c.name)+'</div><div class="sub" dir="ltr">'+esc(c.num)+'</div></div><div class="rowend">'+(detail||pill(c.status))+'</div></div>'}
const screens={
live(){const remaining=Math.max(0,state.total-state.calls),pct=Math.round(state.calls/state.total*100);return '<div class="topline">'+headline('Live session','المكالمات المباشرة')+'<button class="iconbtn" data-action="settings" aria-label="Settings">⚙</button></div>'+
'<div class="hero"><div class="flex between"><div class="grow"><div class="eyebrow">'+txt('ACTIVE CAMPAIGN','الحملة الحالية')+'</div><div style="font-size:16px;font-weight:750;margin-top:4px">'+esc(state.campaign)+'</div></div><div class="chip"><i class="dot" style="'+(state.paused?'background:#ffce77':'')+'"></i>'+ (state.paused?txt('Paused','متوقف مؤقتًا'):txt('Running','قيد التشغيل'))+'</div></div><div class="divider"></div><div class="eyebrow">'+txt('NEXT CONTACT','العميل التالي')+'</div><div class="name">Youssef Nabil</div><div class="number">+20 111 830 2201</div><div style="margin-top:23px" class="flex between"><span class="eyebrow">'+txt('CAMPAIGN PROGRESS','تقدم الحملة')+'</span><b>'+pct+'%</b></div><div class="track" style="margin-top:9px"><div style="width:'+pct+'%"></div></div><div class="rate"><span>'+state.calls+' '+txt('of','من')+' '+state.total+' '+txt('called','تم الاتصال')+'</span><span>'+remaining+' '+txt('left','متبقي')+'</span></div></div>'+
'<div class="section"><b class="sec">'+txt('Results so far','النتائج حتى الآن')+'</b><button class="link" data-tab="results">'+txt('See all','عرض الكل')+'</button></div><div class="card"><div class="metrics">'+cardMetric(state.answered,'Answered','تم الرد','positive')+cardMetric(state.noAnswer,'No answer','لم يرد')+cardMetric(state.failed,'Failed','فشل','negative')+'</div></div>'+
'<div class="section"><b class="sec">'+txt('Up next','القادم في قائمة الاتصال')+'</b><span class="small muted">3 '+txt('contacts','عملاء')+'</span></div><div class="list">'+contacts.slice(2).map((c,i)=>row(c,'<span style="color:var(--muted);font-size:12px">'+(i+1)+'</span>')).join('')+'</div><p class="tabsnote">'+txt('Preview controls simulate state; no real call is placed.','هذه تجربة تصميم فقط؛ لن تُجرى مكالمات حقيقية.')+'</p>'},
campaigns(){return '<div class="topline">'+headline('Campaigns','الحملات')+'<button class="iconbtn" data-action="new" aria-label="New campaign">＋</button></div><div class="section" style="margin-top:4px"><span class="eyebrow">'+txt('CALLING OVERVIEW','ملخص المكالمات')+'</span><span class="small muted">6%</span></div><div style="display:flex;align-items:baseline;gap:7px"><b style="font-size:35px;letter-spacing:-1px">44</b><span class="muted small">/ 739 '+txt('contacts called','عميل تم الاتصال بهم')+'</span></div><div class="progressline"><i style="width:6%"></i></div><div class="metrics" style="margin-top:17px">'+cardMetric('1','Answered','تم الرد','positive')+cardMetric('2%','Answer rate','نسبة الرد')+cardMetric('3','Campaigns','حملات')+'</div><div class="section"><b class="sec">'+txt('Your campaigns','حملاتك')+'</b><button class="link" data-action="new">+ '+txt('New','جديدة')+'</button></div><input class="search" placeholder="'+txt('Search campaigns...','ابحث عن حملة...')+'" aria-label="Search campaigns" id="campaignSearch"/><div class="list" style="margin-top:12px"><div class="item" data-tab="details"><div class="avatar">K</div><div class="grow"><div class="title">Kayan</div><div class="sub">739 '+txt('contacts · SIM 2','عميل · شريحة 2')+'</div><div class="progressline"><i style="width:6%"></i></div></div><div class="rowend"><b style="color:var(--blue)">6%</b></div></div><div class="item" data-tab="details"><div class="avatar">S</div><div class="grow"><div class="title">SODIC East</div><div class="sub">212 '+txt('contacts','عميل')+'</div><div class="progressline"><i style="width:28%"></i></div></div><div class="rowend">28%</div></div><div class="item" data-tab="details"><div class="avatar">L</div><div class="grow"><div class="title">La Vista</div><div class="sub">84 '+txt('contacts','عميل')+'</div><div class="progressline"><i style="width:75%"></i></div></div><div class="rowend">75%</div></div></div><p class="tabsnote">'+txt('Long press a campaign in Android to select multiple campaigns.','الضغط المطول في تطبيق أندرويد يتيح تحديد أكثر من حملة.')+'</p>'},
details(){let arr=contacts.filter(c=>state.contactFilter==="All"||c.status===state.contactFilter);return '<div class="topline"><button class="iconbtn" data-tab="campaigns" aria-label="Back">‹</button><div class="grow"><h2 style="font-size:20px">Kayan</h2><div class="small muted">739 '+txt('contacts · SIM 2','عميل · شريحة 2')+'</div></div><button class="iconbtn" data-action="edit" aria-label="Edit">✎</button></div><div class="section"><b class="sec">'+txt('Campaign progress','تقدم الحملة')+'</b><b style="color:var(--blue)">6%</b></div><div class="progressline"><i style="width:6%"></i></div><div class="metrics" style="margin:19px 0 20px">'+cardMetric(739,'Contacts','عميل')+cardMetric(44,'Called','تم الاتصال')+cardMetric(695,'Remaining','متبقي')+'</div><div class="buttonrow"><button class="outline" data-action="add">＋ '+txt('Add','إضافة')+'</button><button class="outline" data-action="paste">'+txt('Paste','لصق')+'</button><button class="outline" data-action="import">'+txt('Import','استيراد')+'</button></div><input class="search" placeholder="'+txt('Search a contact','ابحث عن عميل')+'" aria-label="Search contacts" id="contactSearch"/><div class="filters">'+['All','Answered','No answer','Pending'].map(k=>'<button data-filter="'+k+'" class="'+(state.contactFilter===k?'active':'')+'">'+esc(k)+'</button>').join('')+'</div><div class="list">'+arr.map(c=>row(c)).join('')+'</div>'},
results(){return '<div class="topline">'+headline('Results','النتائج')+'<button class="iconbtn" data-action="share" aria-label="Share">↗</button></div><div class="small muted" style="margin-bottom:16px">Kayan • 739 '+txt('contacts','عميل')+'</div><div class="hero"><div class="eyebrow">'+txt('CALL PERFORMANCE','أداء المكالمات')+'</div><div style="display:flex;align-items:baseline;gap:9px;margin-top:9px"><b style="font-size:37px">44</b><span class="muted">'+txt('calls placed','مكالمة منفذة')+'</span></div><div class="divider" style="margin:13px 0"></div><div class="flex between"><span>'+txt('Answer rate','نسبة الرد')+'</span><b>2%</b></div><div class="track" style="margin-top:10px"><div style="width:2%"></div></div></div><div class="section"><b class="sec">'+txt('Call outcomes','نتائج المكالمات')+'</b></div><div class="card"><div class="metrics">'+cardMetric(1,'Answered','تم الرد','positive')+cardMetric(40,'No answer','لم يرد')+cardMetric(3,'Failed','فشل','negative')+'</div></div><div class="section"><b class="sec">'+txt('Recent activity','آخر النشاط')+'</b></div><div class="list">'+contacts.slice(0,3).map(c=>row(c)).join('')+'</div>'},
history(){let arr=history.filter(x=>state.filter==="All"||x.status===state.filter);return '<div class="topline">'+headline('Call history','سجل المكالمات')+'<button class="iconbtn" data-action="share" aria-label="Share log">↗</button></div><div class="metrics" style="margin:14px 0 18px">'+cardMetric(46,'All calls','كل المكالمات')+cardMetric(2,'Answered','تم الرد','positive')+cardMetric(41,'No answer','لم يرد')+'</div><div class="filters">'+['All','Answered','No answer','Failed','Unverified'].map(k=>'<button data-filter="'+k+'" class="'+(state.filter===k?'active':'')+'">'+esc(k)+'</button>').join('')+'</div><div class="section" style="margin-top:8px"><b class="sec">'+txt('Today','اليوم')+'</b><span class="small muted">'+arr.length+' '+txt('calls','مكالمات')+'</span></div><div class="list">'+(arr.length?arr.map(c=>row(c,'<div>'+esc(c.time)+'</div><div style="margin-top:4px">'+pill(c.status)+'</div>')).join(''):'<div style="padding:24px;color:var(--muted);text-align:center">'+txt('No calls match this filter','لا توجد مكالمات مطابقة')+'</div>')+'</div>'},
settings(){return '<div class="topline">'+headline('Settings','الإعدادات')+'</div><div class="section"><b class="sec">'+txt('Appearance','المظهر')+'</b></div><div class="list"><div class="item"><div class="grow"><div class="title">'+txt('Dark mode','الوضع الداكن')+'</div><div class="sub">'+txt('Preview both contrast palettes','عاين لوحتي الألوان')+'</div></div><button class="switch '+(state.theme==="dark"?'on':'')+'" data-action="theme" aria-label="Toggle dark"><i></i></button></div><div class="item"><div class="grow"><div class="title">'+txt('Arabic layout','التخطيط العربي')+'</div><div class="sub">'+txt('RTL with LTR phone numbers','من اليمين لليسار والأرقام محفوظة')+'</div></div><button class="switch '+(state.lang==="ar"?'on':'')+'" data-action="lang" aria-label="Toggle Arabic"><i></i></button></div></div><div class="section"><b class="sec">'+txt('Calls','المكالمات')+'</b></div><div class="list"><div class="item"><div class="grow"><div class="title">'+txt('Delay between calls','مدة الانتظار بين المكالمات')+'</div><div class="sub">5 '+txt('seconds','ثوانٍ')+'</div></div><div class="rowend">›</div></div><div class="item"><div class="grow"><div class="title">'+txt('SIM preference','الشريحة المفضلة')+'</div><div class="sub">SIM 2</div></div><div class="rowend">›</div></div><div class="item"><div class="grow"><div class="title">'+txt('Answer detection','اكتشاف الرد')+'</div><div class="sub">'+txt('Use call log when permitted','استخدام سجل المكالمات عند السماح')+'</div></div><div class="rowend">›</div></div></div><div class="section"><b class="sec">'+txt('About','حول التطبيق')+'</b></div><p class="small muted">O2Dialer · Precision Design Preview<br>'+txt('No live calls, no user data','بدون مكالمات أو بيانات شخصية')+'</p>'}
};
function render(){
 document.body.classList.toggle('dark',state.theme==='dark');
 document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
 document.documentElement.lang=state.lang;
 document.getElementById('themeBtn').textContent=state.theme==="dark"?"☀ Light":"☾ Dark";
 document.getElementById('langBtn').textContent=state.lang==="ar"?"English":"عربي";
 document.getElementById('screen').innerHTML=screens[state.tab]();
 document.getElementById('actions').style.display=state.tab==='live'?'block':state.tab==='details'?'block':'none';
 document.getElementById('actions').innerHTML=state.tab==='live'?controls():state.tab==='details'?'<button class="primary" style="width:100%" data-tab="live">'+txt('▶ Go to live session','▶ العودة للجلسة المباشرة')+'</button>':'';
 const nav=[['campaigns',txt('Campaigns','الحملات')],['live',txt('Live','الاتصال')],['results',txt('Results','النتائج')],['history',txt('History','السجل')],['settings',txt('Settings','الإعدادات')]];
 document.getElementById('navbar').innerHTML=nav.map(([key,label])=>'<button class="navbtn '+((state.tab===key||(state.tab==='details'&&key==='campaigns'))?'active':'')+'" data-tab="'+key+'">'+I(key)+'<span>'+label+'</span></button>').join('');
}
let toastTimer;
function showToast(str){const el=document.getElementById('toast');el.textContent=str;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2300)}
document.addEventListener('click',e=>{
const b=e.target.closest('[data-tab],[data-action],[data-filter]');if(!b)return;
if(b.dataset.tab){state.tab=b.dataset.tab;render();document.getElementById('screen').scrollTop=0;return}
if(b.dataset.filter){if(state.tab==='history')state.filter=b.dataset.filter;else state.contactFilter=b.dataset.filter;render();return}
const a=b.dataset.action;
if(a==='pause'){state.paused=!state.paused;render();showToast(state.paused?txt('Session paused','تم إيقاف الجلسة مؤقتًا'):txt('Session resumed','تم استئناف الجلسة'))}
else if(a==='skip'){showToast(txt('Skipped in preview only','تم التخطي في المعاينة فقط'))}
else if(a==='stop'){showToast(txt('Demo only — no active phone call','هذه معاينة فقط — لا توجد مكالمة فعلية'))}
else if(a==='settings'){state.tab='settings';render()}
else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';render()}
else if(a==='lang'){state.lang=state.lang==='ar'?'en':'ar';render()}
else{showToast(txt('Preview interaction — no saved changes','تفاعل تجريبي — لن تُحفظ أي تغييرات'))}
});
document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render()};
document.getElementById('langBtn').onclick=()=>{state.lang=state.lang==='ar'?'en':'ar';render()};
document.getElementById('resetBtn').onclick=()=>{state.tab='live';state.paused=false;state.theme='light';state.lang='en';render()};
let firstVersion=null;
async function checkVersion(){
try{const response=await fetch('./revision.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)return;const info=await response.json();document.getElementById('buildLine').textContent='Preview revision '+String(info.sha||'').slice(0,8);
if(firstVersion===null)firstVersion=info.sha;else if(info.sha&&firstVersion!==info.sha){location.reload()}}catch(_e){}
}
render();checkVersion();setInterval(checkVersion,12000);
})();
</script>
</body>
</html>
